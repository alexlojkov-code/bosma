<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Posts Generator</title>
  <style>
    :root { --bg: #f7f6f3; --fg: #1b1b1b; --muted: #6b6b6b; --accent: #3b5bdb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #ececec; --muted: #9a9a9a; --accent: #8ea2ff; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, system-ui, sans-serif; }
    main { max-width: 520px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 6px; color: var(--muted); }
    code { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Social Posts Generator</h1>
    <p>Проект создан. Здесь появится генератор постов для соцсетей.</p>
    <p>Статус API: <code id="health">проверяю…</code></p>
  </main>
  <script>
    fetch('/api/health').then(r => r.json()).then(d => {
      document.getElementById('health').textContent = d.ok ? 'работает' : 'ошибка';
    }).catch(() => { document.getElementById('health').textContent = 'недоступен'; });
  </script>
</body>
</html>
